services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: dream_test
      POSTGRES_PASSWORD: disposable_local_only
      POSTGRES_DB: dream_test
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dream_test -d dream_test"]
      interval: 5s
      timeout: 3s
      retries: 10
